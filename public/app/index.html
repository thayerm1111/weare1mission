<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#060912"/>
<link rel="manifest" href="/app/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/app/icon-180.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>One Mission — Trade Desk</title>
<style>:root{
  --bg:#060912; --bg2:#0a1120; --panel:#0c1424; --panel2:#0e1830; --line:rgba(120,160,220,.14);
  --ink:#eaf1ff; --muted:#93a3c4; --faint:#5f7099;
  --green:#2ee88f; --greenglow:rgba(46,232,143,.45); --red:#ff5d6c; --amber:#ffc24b; --sky:#39c6ff; --slate:#7f8db0;
  --navy:#6fa8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:
  radial-gradient(1200px 600px at 50% -10%,rgba(30,80,160,.18),transparent 60%),
  radial-gradient(900px 500px at 100% 100%,rgba(20,120,90,.10),transparent 60%),
  var(--bg);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:600px;margin:0 auto;min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}

.brand{font-weight:800;letter-spacing:.12em;font-size:16px;display:flex;align-items:center;gap:6px}
.brand span{color:var(--sky)}
.brand.big{font-size:30px;letter-spacing:.14em;justify-content:center}
.out{color:var(--faint);font-size:12px;font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;padding:9px 13px;border-radius:13px;
  border:1px solid var(--line);background:var(--bg2);min-width:104px}
.tab.on{border-color:rgba(57,198,255,.6);background:linear-gradient(180deg,rgba(57,198,255,.16),rgba(57,198,255,.04));box-shadow:0 0 20px rgba(57,198,255,.14)}
.tab-l{font-weight:700;font-size:13px}
.tab-t{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.tab.on .tab-t{color:var(--sky)}
.main{padding:6px 14px 0}
.foot{color:var(--faint);font-size:11px;text-align:center;padding:22px 24px 0;line-height:1.5}

.blurb{color:var(--muted);font-size:13px;padding:2px 4px 12px}
.controls{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.fld{display:block;margin-bottom:13px}
.fld-l{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.fld-l em{font-style:normal;color:var(--sky);letter-spacing:.02em;margin-left:4px}
/* native dropdown */
.selwrap{position:relative}
.sel{width:100%;appearance:none;-webkit-appearance:none;padding:15px 42px 15px 15px;border-radius:13px;border:1px solid var(--line);
  background:var(--bg2);color:var(--ink);font-size:17px;font-weight:700;outline:none}
.sel:focus{border-color:var(--sky)}
.selcar{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--sky);pointer-events:none;font-size:13px}
/* segmented timeframe */
.segs{display:flex;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:4px}
.seg{flex:1;padding:11px 0;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:capitalize}
.seg.on{background:linear-gradient(180deg,#65d6ff,#2eb8ef);color:#04121f;box-shadow:0 4px 14px rgba(46,184,239,.28)}
/* strategy toggle chips */
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:13px;font-weight:600;color:var(--muted)}
.chip.sm{padding:8px 12px;font-size:12.5px;font-weight:700}
.chip.off{color:var(--faint);opacity:.75}
.chip.on{border-color:transparent;color:#04121f;background:linear-gradient(180deg,#65d6ff,#2eb8ef);box-shadow:0 3px 12px rgba(46,184,239,.25)}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:15px;outline:none}
.inp:focus{border-color:var(--sky)}
.run{width:100%;padding:14px;border-radius:13px;font-weight:800;font-size:15px;letter-spacing:.03em;color:#04121f;
  background:linear-gradient(180deg,#65d6ff,#2eb8ef);box-shadow:0 8px 24px rgba(46,184,239,.28);margin-top:2px}
.run:disabled{opacity:.6}
.err{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,93,108,.3);background:rgba(255,93,108,.08);color:#ffb3ba;font-size:13px}
.empty{margin-top:26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:26px 20px;
  border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(12,20,36,.5),rgba(6,12,24,.4))}
.empty-i{width:56px;height:56px;display:grid;place-items:center;border-radius:16px;font-size:24px;color:var(--sky);
  border:1px solid rgba(57,198,255,.3);background:rgba(57,198,255,.08);box-shadow:0 0 26px rgba(57,198,255,.16)}
.empty p{font-size:14px;color:var(--muted);line-height:1.55;margin:0;max-width:280px}
.empty p b{color:var(--ink)}
.empty .steps{display:flex;flex-direction:column;gap:7px;margin-top:4px;text-align:left}
.empty .steps span{font-size:12.5px;color:var(--faint)}

/* ── signal card ── */
.sig{margin-top:14px;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel),var(--bg2));padding:16px;position:relative;overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.4)}
.sig.long{box-shadow:0 20px 50px rgba(0,0,0,.4),inset 0 0 0 1px rgba(46,232,143,.12)}
.sig.short{box-shadow:0 20px 50px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,93,108,.12)}

.sig-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sig-hd-l{display:flex;gap:11px;align-items:center}
.flag{font-size:26px;line-height:1}
.sig-sym{font-size:26px;font-weight:800;letter-spacing:.02em}
.sig-tags{display:flex;gap:6px;margin-top:3px}
.sig-tags span{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.sig-hd-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.dirpill{font-size:14px;font-weight:800;letter-spacing:.04em;padding:7px 16px;border-radius:12px;border:1px solid}
.dirpill.long{color:var(--green);border-color:var(--greenglow);background:rgba(46,232,143,.1);box-shadow:0 0 22px rgba(46,232,143,.25)}
.dirpill.short{color:var(--red);border-color:rgba(255,93,108,.5);background:rgba(255,93,108,.1);box-shadow:0 0 22px rgba(255,93,108,.2)}
.dirpill.flat{color:var(--slate);border-color:var(--line);background:rgba(127,141,176,.08)}
.sig-when{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:10px;color:var(--faint);letter-spacing:.04em}
.sig-when span:first-child{color:var(--muted);font-weight:700;font-size:12px}

/* score + confidence */
.sig-score{display:flex;gap:14px;align-items:center;margin:16px 0 4px}
.gaugewrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;width:124px}
.gauge{position:relative;width:118px;height:118px}
.gring{width:118px;height:118px}
.gtrack{fill:none;stroke:rgba(120,160,220,.14);stroke-width:9}
.gfill{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .7s ease}
.gring.green .gfill{stroke:var(--green);filter:drop-shadow(0 0 6px var(--greenglow))}
.gring.sky .gfill{stroke:var(--sky);filter:drop-shadow(0 0 6px rgba(57,198,255,.4))}
.gring.amber .gfill{stroke:var(--amber);filter:drop-shadow(0 0 6px rgba(255,194,75,.4))}
.gring.slate .gfill{stroke:var(--slate)}
.gcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.gcap{font-size:9px;letter-spacing:.22em;color:var(--faint);font-weight:700}
.gnum{font-size:38px;font-weight:800;line-height:1}
.gnum.green{color:var(--green)} .gnum.sky{color:var(--sky)} .gnum.amber{color:var(--amber)} .gnum.slate{color:var(--slate)}
.gnum .gmax{font-size:16px;font-weight:700;color:var(--faint);letter-spacing:0}
.score8lbl{font-size:13.5px;color:var(--muted);line-height:1.5}
.score8lbl b{color:var(--ink);font-weight:800}
.gprob{font-size:9px;letter-spacing:.12em;font-weight:800;white-space:nowrap;text-align:center}
.gprob.green{color:var(--green)} .gprob.sky{color:var(--sky)} .gprob.amber{color:var(--amber)} .gprob.slate{color:var(--muted)}
.sig-score-r{flex:1;min-width:0}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;border:1px solid}
.badge-green{color:var(--green);border-color:var(--greenglow);background:rgba(46,232,143,.12)}
.badge-amber{color:var(--amber);border-color:rgba(255,194,75,.4);background:rgba(255,194,75,.12)}
.badge-sky{color:var(--sky);border-color:rgba(57,198,255,.4);background:rgba(57,198,255,.12)}
.badge-red{color:var(--red);border-color:rgba(255,93,108,.4);background:rgba(255,93,108,.12)}
.badge-slate{color:var(--slate);border-color:var(--line);background:rgba(127,141,176,.1)}
.grade,.clabel{font-size:10px;font-weight:800;letter-spacing:.05em;padding:4px 9px;border-radius:999px;color:var(--amber);border:1px solid rgba(255,194,75,.3);background:rgba(255,194,75,.08)}
.clabel{color:var(--muted);border-color:var(--line);background:transparent}
.eqwrap{}
.eqhead{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.14em;color:var(--faint);font-weight:700;margin-bottom:5px}
.eqhead b{font-size:17px;color:var(--green);letter-spacing:0}
.eq{display:flex;align-items:flex-end;gap:2px;height:34px}
.eqbar{flex:1;background:rgba(120,160,220,.14);border-radius:2px;min-height:12%}
.eqbar.on{background:linear-gradient(180deg,var(--green),#1aa268);box-shadow:0 0 6px var(--greenglow)}

/* chart */
.sig-chart{margin:14px -2px 2px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(10,20,40,.6),rgba(6,12,24,.6));padding:6px 4px;overflow:hidden}
.chart{width:100%;height:220px;display:block}
.chart .wick{stroke-width:1}
.chart .cu .wick,.chart .cu .body{stroke:#2ee88f;fill:rgba(46,232,143,.85)}
.chart .cd .wick,.chart .cd .body{stroke:#ff5d6c;fill:rgba(255,93,108,.8)}
.chart .body{stroke-width:.5}
.chart .hl{stroke-width:1;stroke-dasharray:4 4}
.chart .hl.e{stroke:#6fa8ff} .chart .hl.s{stroke:#ff5d6c} .chart .hl.t{stroke:#2ee88f;opacity:.8}
.chart .hlt{font-size:9px;font-weight:700}
.chart .hlt.e{fill:#8fbcff} .chart .hlt.s{fill:#ff8f99} .chart .hlt.t{fill:#5eeaa6}
.chart .zone{fill:rgba(111,168,255,.12);stroke:rgba(111,168,255,.35);stroke-width:.5}

/* trade plan */
.plan{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(180deg,rgba(12,22,44,.7),rgba(8,14,28,.7))}
.plan-hd{font-size:10px;letter-spacing:.22em;color:var(--faint);font-weight:800}
.plan-dir{font-size:40px;font-weight:800;line-height:1;margin:6px 0 12px;display:flex;flex-direction:column}
.plan-dir.long{color:var(--green);text-shadow:0 0 22px var(--greenglow)}
.plan-dir.short{color:var(--red);text-shadow:0 0 22px rgba(255,93,108,.35)}
.plan-dir span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:5px;text-shadow:none}
.plan-grid{display:flex;flex-wrap:wrap;gap:8px}
.lvl{flex:1 1 130px;min-width:120px;display:flex;flex-direction:column;gap:3px;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(8,16,32,.6)}
.lvl-cap{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.lvl-v{font-size:20px;font-weight:800}
.lvl-e .lvl-v{color:var(--navy)} .lvl-s .lvl-v{color:var(--red)} .lvl-t .lvl-v{color:var(--green)}
.lvl-sub{font-size:9px;color:var(--faint)}
.pips{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.03em;padding:2px 8px;border-radius:999px;border:1px solid}
.pips.s{color:var(--red);border-color:rgba(255,93,108,.4);background:rgba(255,93,108,.1)}
.pips.t{color:var(--green);border-color:var(--greenglow);background:rgba(46,232,143,.1)}
.plan-foot{display:flex;gap:10px;margin-top:12px}
.plan-foot>div{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;background:rgba(8,16,32,.5)}
.plan-foot span{display:block;font-size:9px;letter-spacing:.14em;color:var(--faint);font-weight:700;margin-bottom:3px}
.plan-foot b{font-size:18px;font-weight:800}
.plan-foot .pot{color:var(--green)}

/* sections */
.sec{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.sec-h{width:100%;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sec-x{color:var(--faint);font-size:16px}
.sec-b{padding-top:10px}
.why{list-style:none;margin:0;padding:0}
.why li{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:13.5px;color:#dbe4f6}
.wck{flex:0 0 18px;height:18px;line-height:18px;text-align:center;border-radius:999px;font-size:11px;font-weight:800;color:var(--green);background:rgba(46,232,143,.15)}
.rz{margin:0 0 8px;font-size:13.5px;line-height:1.5;color:#cfd8ec}
.next{margin:0;padding-left:2px;list-style:none}
.next li{position:relative;padding:0 0 7px 18px;font-size:13.5px;color:#cfd8ec}
.next li::before{content:"→";position:absolute;left:0;color:var(--sky)}
.klev{display:flex;flex-direction:column;gap:2px}
.kl{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(120,160,220,.07)}
.kl span{color:var(--muted)} .kl b{font-weight:700}

/* trend alignment */
.tal{display:flex;flex-direction:column;gap:6px}
.talrow{display:grid;grid-template-columns:52px 1fr 20px;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(8,16,32,.5)}
.taltf{font-weight:800;font-size:12px;color:var(--muted)}
.tallbl{font-size:11px;font-weight:800;letter-spacing:.06em}
.talar{font-size:15px;font-weight:800;text-align:center}
.up{color:var(--green)} .dn{color:var(--red)} .fl{color:var(--slate)}

/* rsi */
.rsi{margin-top:12px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(8,16,32,.5)}
.rsi-l{display:flex;align-items:baseline;gap:10px}
.rsi-cap{font-size:10px;letter-spacing:.14em;color:var(--faint);font-weight:700}
.rsi-v{font-size:26px;font-weight:800}
.rsi-lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}

/* scouts */
.scouts{list-style:none;margin:0;padding:0}
.scout{display:grid;grid-template-columns:12px 118px 1fr;gap:8px;align-items:start;padding:5px 0;font-size:12.5px}
.scout.quiet{opacity:.5}
.sdot{width:9px;height:9px;border-radius:999px;margin-top:5px;background:var(--slate)}
.sdot.long{background:var(--green)} .sdot.short{background:var(--red)}
.sname{font-weight:700;font-size:12px} .sread{color:var(--muted)}

.news{margin-top:13px;padding:11px 13px;border-radius:12px;font-size:12px;line-height:1.5;border:1px solid rgba(255,194,75,.32);background:rgba(255,194,75,.07);color:#f0dcae}
.news b{color:var(--amber)}
/* save trade + per-trade chat */
.savetrade{width:100%;margin-top:13px;padding:13px;border-radius:12px;font-size:14px;font-weight:800;letter-spacing:.01em;
  border:1px solid var(--greenglow);color:var(--green);background:rgba(46,232,143,.1)}
.savetrade.saved{color:#04121f;background:linear-gradient(180deg,#3cf0a0,#22c483);border-color:transparent}
.savetrade.saving{opacity:.7}
.savetrade.err{color:var(--red);border-color:rgba(255,93,108,.4);background:rgba(255,93,108,.1)}
.tchat{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.tchat-t{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-radius:12px;
  border:1px solid rgba(57,198,255,.35);background:rgba(57,198,255,.08);color:var(--sky);font-size:13.5px;font-weight:800}
.tchat-x{font-size:17px}
.tchat-b{margin-top:11px;display:flex;flex-direction:column;gap:9px}
.tchat-hint{font-size:12px;color:var(--faint);line-height:1.55;padding:1px 2px 4px}
.tchat-bar{display:flex;gap:8px;margin-top:2px}

.creed{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;text-align:center}
.creed b{display:block;font-size:13px;letter-spacing:.02em;color:#dbe4f6}
.creed span{display:block;font-size:10px;color:var(--faint);margin-top:4px;letter-spacing:.05em}

/* bottom nav + screens */
.shell{padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:76px}
.bnav{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;display:flex;
  background:rgba(8,12,24,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--faint)}
.bn-i{font-size:17px;line-height:1}
.bn-l{font-size:10px;font-weight:700;letter-spacing:.03em}
.bn.on{color:var(--sky)}
.bn.on .bn-i{text-shadow:0 0 12px rgba(57,198,255,.5)}
.scr{padding:6px 2px 8px}
.scr-h{font-size:20px;font-weight:800;letter-spacing:.01em;padding:4px 4px 2px}
.scr-sub{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:20px 4px 10px}
.scr-blurb{color:var(--muted);font-size:13px;padding:2px 4px 14px}
.load{color:var(--faint);font-size:13px;text-align:center;padding:22px}

/* -- Floor launcher (5-card premium landing) -- */
.floor-h{padding:8px 4px 2px}
.floor-k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.floor-t{font-size:26px;font-weight:800;letter-spacing:.01em;margin-top:3px}
.floor-s{color:var(--muted);font-size:13px;margin-top:3px}
.flgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.flcard{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);border-radius:18px;padding:15px 15px 16px;background:linear-gradient(180deg,var(--panel),var(--bg2));min-height:118px;transition:transform .12s ease,border-color .12s ease}
.flcard:active{transform:scale(.985)}
.flcard.span{grid-column:1 / -1}
.flcard.hero{grid-column:1 / -1;min-height:132px;border-color:rgba(57,198,255,.4);background:linear-gradient(180deg,rgba(57,198,255,.14),rgba(57,198,255,.03))}
.flcard.adv{border-color:var(--line);background:linear-gradient(180deg,rgba(120,160,220,.05),transparent);opacity:.92}
.fl-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(120,160,220,.1);border:1px solid var(--line)}
.flcard.hero .fl-ic{background:rgba(57,198,255,.16);border-color:rgba(57,198,255,.35);color:var(--sky)}
.flcard.adv .fl-ic{background:rgba(120,160,220,.07)}
.fl-nm{font-size:16px;font-weight:800;letter-spacing:.01em}
.flcard.hero .fl-nm{font-size:18px}
.fl-bl{font-size:12px;color:var(--muted);line-height:1.4}
.fl-tag{position:absolute;top:13px;right:14px;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.flcard.hero .fl-tag{color:var(--sky);border-color:rgba(57,198,255,.4)}
.fl-cta{margin-top:auto;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--sky);display:flex;align-items:center;gap:5px}
.flcard.adv .fl-cta{color:var(--muted)}
.floor-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);padding:8px 4px 6px}
.floor-back:active{color:var(--ink)}
.optgrid{display:grid;gap:8px;margin-top:4px}
.optgrid.c2{grid-template-columns:1fr 1fr}
.optgrid.c3{grid-template-columns:1fr 1fr 1fr}
.optbtn{border:1px solid var(--line);border-radius:12px;padding:9px 8px;text-align:center;background:var(--bg2);color:var(--muted);transition:border-color .12s,background .12s}
.optbtn.on{border-color:rgba(57,198,255,.55);background:rgba(57,198,255,.1);color:var(--ink)}
.optbtn b{display:block;font-size:13px;font-weight:700}
.optbtn span{display:block;font-size:9px;margin-top:2px;color:var(--faint);letter-spacing:.02em}

/* -- Dashboard -- */
.dash{padding:6px 4px 8px}
.dash-hi{font-size:22px;font-weight:800;letter-spacing:.01em;padding:4px 2px 1px}
.dash-sub{color:var(--muted);font-size:13px;padding:0 2px 6px}
.dsec-k{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:20px 2px 9px;display:flex;justify-content:space-between;align-items:center}
.dsec-k a,.dsec-k button{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--sky);text-transform:none}
.dstat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.dstat.two{grid-template-columns:repeat(2,1fr)}
.dst{border:1px solid var(--line);border-radius:15px;padding:13px 12px;background:linear-gradient(180deg,var(--panel),var(--bg2));text-align:center}
.dst-v{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.dst-v.g{color:var(--green)}
.dst-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-top:4px}
.dwin{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:rgba(8,16,32,.5);margin-bottom:8px}
.dwin-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(46,232,143,.12);color:var(--green);flex:0 0 auto}
.dwin-b{min-width:0;flex:1}
.dwin-s{font-size:14px;font-weight:800}
.dwin-m{font-size:11px;color:var(--faint);margin-top:1px}
.dwin-r{font-size:13px;font-weight:800;color:var(--green);white-space:nowrap}
.dwin-r.dir{color:var(--muted);font-weight:700}
.dprev{border:1px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(180deg,var(--panel),var(--bg2));margin-bottom:10px}
.dprev.hot{border-color:rgba(57,198,255,.35);background:linear-gradient(180deg,rgba(57,198,255,.1),transparent)}
.dprev-k{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.dprev-t{font-size:17px;font-weight:800;margin-top:5px}
.dprev-s{font-size:12px;color:var(--muted);margin-top:3px}
.dprev-cta{margin-top:11px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--sky)}
.dprev-live{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--greenglow)}

/* -- Plug In -- */
.pin{padding:6px 4px 8px}
.pin-next{border:1px solid rgba(57,198,255,.32);border-radius:20px;padding:18px;margin-top:6px;background:radial-gradient(600px 200px at 100% 0%,rgba(57,198,255,.14),transparent 70%),linear-gradient(180deg,var(--panel2),var(--bg2))}
.pin-next.live{border-color:rgba(46,232,143,.45);background:linear-gradient(180deg,rgba(46,232,143,.12),var(--bg2))}
.pin-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}
.pin-next.live .pin-badge{color:var(--green)}
.pin-when{font-size:13px;font-weight:700;color:var(--muted);margin-top:9px}
.pin-title{font-size:20px;font-weight:800;margin-top:4px}
.pin-cd{display:flex;gap:8px;margin-top:12px}
.pin-cd .u{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px 4px;background:rgba(8,16,32,.5)}
.pin-cd .u b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.pin-cd .u span{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pin-join{margin-top:14px;width:100%;padding:13px;border-radius:13px;font-size:14px;font-weight:800;background:linear-gradient(180deg,rgba(57,198,255,.9),rgba(57,198,255,.7));color:#04121f;text-align:center;display:block}
.pin-next.live .pin-join{background:linear-gradient(180deg,var(--green),#22c07a);color:#03130b}
.pin-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:rgba(8,16,32,.5);margin-bottom:8px}
.pin-row-d{flex:0 0 auto;width:44px;text-align:center}
.pin-row-d b{display:block;font-size:15px;font-weight:800}
.pin-row-d span{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.pin-row-b{min-width:0;flex:1}
.pin-row-t{font-size:14px;font-weight:800}
.pin-row-m{font-size:11px;color:var(--faint);margin-top:1px}
.replays{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rep{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(180deg,var(--panel),var(--bg2));text-align:left}
.rep-th{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--sky);background:radial-gradient(200px 120px at 50% 30%,rgba(57,198,255,.18),transparent),rgba(8,16,32,.6);border-bottom:1px solid var(--line)}
.rep-b{padding:10px 11px 12px}
.rep-t{font-size:13px;font-weight:800;line-height:1.25}
.rep-m{font-size:10px;color:var(--faint);margin-top:4px}
.pin-cats{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pin-cats::-webkit-scrollbar{display:none}
.pin-cat{flex:0 0 auto;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--bg2)}
.pin-cat.on{border-color:rgba(57,198,255,.5);color:var(--sky);background:rgba(57,198,255,.08)}
.emptybox{text-align:center;color:var(--faint);font-size:12px;padding:18px;border:1px dashed var(--line);border-radius:14px;background:var(--bg2)}

/* chat — fill the screen, messages scroll, input pinned at the bottom */
.chatscreen{display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - 88px);min-height:calc(100dvh - env(safe-area-inset-top,0px) - 88px)}
.chat{flex:1 1 auto;display:flex;flex-direction:column;gap:9px;padding:10px 2px 12px;overflow-y:auto;min-height:0}
.bub{max-width:84%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.bub.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:linear-gradient(180deg,rgba(57,198,255,.2),rgba(57,198,255,.1));border:1px solid rgba(57,198,255,.3);border-bottom-right-radius:4px}
.chatbar{flex:0 0 auto;display:flex;gap:8px;padding:10px 0 6px;background:var(--bg)}
.send{flex:0 0 auto;padding:0 18px;border-radius:12px;font-weight:800;color:#04121f;background:linear-gradient(180deg,#65d6ff,#2eb8ef)}
.send:disabled{opacity:.6}

/* charts / upload */
.upl{display:flex;align-items:center;justify-content:center;min-height:120px;border:1px dashed var(--line);border-radius:14px;background:var(--bg2);color:var(--muted);font-size:14px;margin-bottom:10px;cursor:pointer;overflow:hidden}
.uplimg{width:100%;border-radius:12px;display:block}
.verdict{margin-top:12px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:700}
.v-agree{color:var(--green);background:rgba(46,232,143,.1);border:1px solid var(--greenglow)}
.v-disagree{color:var(--red);background:rgba(255,93,108,.1);border:1px solid rgba(255,93,108,.4)}
.v-partial{color:var(--amber);background:rgba(255,194,75,.1);border:1px solid rgba(255,194,75,.4)}

/* weekly */
.wknote{font-size:13px;color:var(--muted);border-left:2px solid var(--sky);padding:2px 0 2px 12px;margin:4px 4px 12px}
.wk{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;background:linear-gradient(180deg,var(--panel),var(--bg2))}
.wk-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-tk{font-size:18px;font-weight:800}
.wk-nm{font-size:12px;color:var(--muted)}
.wk-cv{margin-left:auto;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.wk-cv.high{color:var(--green);background:rgba(46,232,143,.12)} .wk-cv.medium{color:var(--amber);background:rgba(255,194,75,.12)} .wk-cv.low{color:var(--slate);background:rgba(127,141,176,.12)}
.wk-th{font-size:13.5px;line-height:1.5;color:#dbe4f6;margin:9px 0}
.wk-kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.wk-kv span{color:var(--muted)} .wk-kv b{color:var(--green);font-weight:700}
.wk-risk{font-size:12px;color:var(--faint);margin-top:7px}

/* account */
.acct{border:1px solid var(--line);border-radius:14px;padding:6px 14px;background:var(--panel);margin-bottom:12px}
.acct-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(120,160,220,.07);font-size:14px}
.acct-row:last-child{border-bottom:none}
.acct-row span{color:var(--muted)} .acct-row b{font-weight:700}
.acct-row.big b{font-size:22px}
.cr{color:var(--sky)}
.jr{display:grid;grid-template-columns:52px 1fr auto auto;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;font-size:13px;background:rgba(8,16,32,.5)}
.jr-d{font-weight:800;font-size:11px} .jr-d.long{color:var(--green)} .jr-d.short{color:var(--red)}
.jr-s{font-weight:700} .jr-e{color:var(--muted);font-size:12px} .jr-r{color:var(--faint);font-size:11px;text-transform:uppercase}
.out.big{width:100%;margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-weight:700}

/* Market Pulse ranked list */
.pulse{margin-top:16px}
.pulse-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 2px 10px}
.prow-wrap{margin-bottom:9px}
.prow{width:100%;display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel),var(--bg2));text-align:left}
.prow.op{border-color:rgba(57,198,255,.5);box-shadow:0 0 20px rgba(57,198,255,.1)}
.prank{flex:0 0 auto;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--faint);background:rgba(255,255,255,.05)}
.pflag{font-size:20px;line-height:1}
.psym{flex:1;min-width:0;display:flex;flex-direction:column;font-size:16px;font-weight:800}
.psym em{font-style:normal;font-size:11px;font-weight:600;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdir{flex:0 0 auto;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px}
.pdir.long{color:var(--green);background:rgba(46,232,143,.12)} .pdir.short{color:var(--red);background:rgba(255,93,108,.12)} .pdir.flat{color:var(--slate)}
.pscore{flex:0 0 auto;font-size:26px;font-weight:800;line-height:1;min-width:56px;text-align:right}
.pscore b{font-size:14px;font-weight:700;color:var(--faint)}
.pscore.green{color:var(--green)} .pscore.amber{color:var(--amber)} .pscore.slate{color:var(--slate)}
.pcar{flex:0 0 auto;color:var(--faint);font-size:11px;width:12px}
.prow.op + *,.prow-wrap .sig{margin-top:9px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px 24px}
.login-box{width:100%;max-width:360px;text-align:center}
.login-box .tag{color:var(--muted);font-size:13px;margin:6px 0 22px}
.login-box form{display:flex;flex-direction:column;gap:11px}
.hint{color:var(--faint);font-size:11px;margin-top:16px;line-height:1.5}

/* ── xGhost — 5-pair AI scalping scanner ── */
.tab.tab-x.on{border-color:rgba(46,232,143,.55);background:linear-gradient(180deg,rgba(46,232,143,.16),rgba(46,232,143,.03));box-shadow:0 0 20px rgba(46,232,143,.16)}
.tab.tab-x.on .tab-t{color:var(--green)}
.xg{padding-top:6px}
.xg-hero{border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
  background:radial-gradient(600px 220px at 100% 0,rgba(46,232,143,.12),transparent 60%),linear-gradient(180deg,var(--panel),var(--bg2))}
.xg-hero-top{display:flex;align-items:center;justify-content:space-between}
.xg-badge{font-weight:900;letter-spacing:.16em;font-size:13px;color:#04121f;background:linear-gradient(180deg,#4bf0a3,#22c483);
  padding:5px 12px;border-radius:9px;box-shadow:0 4px 16px rgba(46,232,143,.32)}
.xg-live{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--green)}
.xg-h2{font-size:21px;font-weight:800;margin:12px 0 6px;letter-spacing:.01em}
.xg-sub{font-size:13px;color:var(--muted);line-height:1.55;margin:0}
.xg-sub b{color:var(--ink)}
.xg-pairs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.xg-pair{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:rgba(8,16,32,.5)}
.xg-scan{background:linear-gradient(180deg,#4bf0a3,#20bd7e);box-shadow:0 8px 24px rgba(46,232,143,.3);color:#04121f}
.xg-res{margin-top:16px}

/* DXY strip */
.dxystrip{border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px;
  background:linear-gradient(180deg,rgba(12,22,44,.7),rgba(8,14,28,.6))}
.dxyhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dxytitle{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.dxytitle em{font-style:normal;color:var(--faint);letter-spacing:.02em;font-weight:600;margin-left:6px;font-size:10px}
.dxystate{font-size:14px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.dxystate b{font-size:16px}
.dxystate.up{color:var(--green)} .dxystate.dn{color:var(--red)} .dxystate.fl{color:var(--slate)}
.dxytfs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
.dxytf{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:11px;border:1px solid var(--line);background:rgba(8,16,32,.5)}
.dxytf-t{font-size:11px;font-weight:800;color:var(--muted)}
.dxytf-a{font-size:18px;font-weight:800;line-height:1}
.dxytf-l{font-size:9px;font-weight:700;letter-spacing:.03em;color:var(--faint);text-transform:uppercase}
.dxytf.up{border-color:rgba(46,232,143,.35);background:rgba(46,232,143,.08)} .dxytf.up .dxytf-a{color:var(--green)}
.dxytf.dn{border-color:rgba(255,93,108,.35);background:rgba(255,93,108,.08)} .dxytf.dn .dxytf-a{color:var(--red)}
.dxytf.fl .dxytf-a{color:var(--slate)}
.dxyfoot{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.5}

.xg-news{margin-bottom:12px;padding:11px 13px;border-radius:12px;font-size:12px;font-weight:700;line-height:1.5;
  border:1px solid rgba(255,194,75,.32);background:rgba(255,194,75,.08);color:#f0dcae}
.xg-lbl{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--green);margin:2px 2px 0}
.xg-best .sig{margin-top:8px}
.xg-notrade{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 20px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(12,20,36,.5),rgba(6,12,24,.4))}
.xg-nt-i{font-size:30px}
.xg-notrade b{font-size:16px;color:var(--ink)}
.xg-notrade span{font-size:13px;color:var(--muted);line-height:1.55;max-width:300px}
.xg-supp{margin:12px 0;padding:11px 13px;border-radius:12px;border:1px solid rgba(57,198,255,.28);background:rgba(57,198,255,.07)}
.xg-supp b{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--sky);margin-bottom:4px}
.xg-supp span{font-size:12px;color:var(--muted);line-height:1.5}
.xg-board{margin-top:16px}
.xg-board-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 2px 10px}
.xg-prow{gap:9px}
.xg-st{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.03em;padding:4px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.xg-st-green{color:var(--green);background:rgba(46,232,143,.12)}
.xg-st-amber{color:var(--amber);background:rgba(255,194,75,.12)}
.xg-st-sky{color:var(--sky);background:rgba(57,198,255,.12)}
.xg-st-slate{color:var(--slate);background:rgba(127,141,176,.1)}
.xg-prow .pscore{min-width:40px}
.xg-ver{text-align:center;font-size:11px;color:var(--faint);margin-top:16px;letter-spacing:.02em}

/* card additions shared by xGhost */
.xchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.xchip{font-size:11px;font-weight:800;letter-spacing:.03em;padding:5px 11px;border-radius:999px;border:1px solid}
.xexec-green{color:var(--green);border-color:var(--greenglow);background:rgba(46,232,143,.12)}
.xexec-amber{color:var(--amber);border-color:rgba(255,194,75,.4);background:rgba(255,194,75,.12)}
.xexec-sky{color:var(--sky);border-color:rgba(57,198,255,.4);background:rgba(57,198,255,.12)}
.xexec-slate{color:var(--slate);border-color:var(--line);background:rgba(127,141,176,.1)}
.xdxy-confirms{color:var(--green);border-color:var(--greenglow);background:rgba(46,232,143,.1)}
.xdxy-partial{color:var(--amber);border-color:rgba(255,194,75,.4);background:rgba(255,194,75,.1)}
.xdxy-neutral{color:var(--slate);border-color:var(--line);background:rgba(127,141,176,.08)}
.xdxy-conflicts{color:var(--red);border-color:rgba(255,93,108,.4);background:rgba(255,93,108,.1)}
.dxynote{margin-top:12px;padding:10px 13px;border-radius:12px;font-size:12.5px;line-height:1.5;color:#cfd8ec;border:1px solid var(--line);background:rgba(8,16,32,.5)}
.dxynote span{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--faint);margin-bottom:3px}
.dxynote.dxy-confirms{border-color:rgba(46,232,143,.28)} .dxynote.dxy-conflicts{border-color:rgba(255,93,108,.28)}
.vetoes{margin:0;padding-left:2px;list-style:none}
.vetoes li{position:relative;padding:0 0 7px 18px;font-size:13px;color:#e6c3c8}
.vetoes li::before{content:"✕";position:absolute;left:0;color:var(--red);font-weight:800;font-size:11px}
.brk{display:flex;flex-direction:column;gap:8px}
.brkrow{display:grid;grid-template-columns:104px 1fr 52px;align-items:center;gap:9px}
.brkc{font-size:11.5px;color:var(--muted);text-transform:capitalize}
.brkbar{height:7px;border-radius:999px;background:rgba(120,160,220,.12);overflow:hidden}
.brkfill{display:block;height:100%;border-radius:999px}
.brkfill.green{background:linear-gradient(90deg,#1aa268,#2ee88f)} .brkfill.amber{background:var(--amber)} .brkfill.slate{background:var(--slate)}
.brkpts{font-size:13px;font-weight:800;text-align:right}
.brkpts em{font-style:normal;font-size:10px;font-weight:600;color:var(--faint)}

/* ── xGhost Performance (admin) ── */
.xperf-open{width:100%;margin:12px 0 4px;padding:14px;border-radius:13px;text-align:left;display:flex;flex-direction:column;gap:2px;
  border:1px solid rgba(46,232,143,.4);background:linear-gradient(180deg,rgba(46,232,143,.12),rgba(46,232,143,.03))}
.xperf-open span{font-weight:800;font-size:14px;color:var(--green)}
.xperf-open em{font-style:normal;font-size:11px;color:var(--muted)}
.xperf-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.xperf-title{font-size:19px;font-weight:800;letter-spacing:.01em}
.xback{font-size:13px;font-weight:700;color:var(--muted);padding:6px 4px}
.xrefresh{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);color:var(--sky);font-size:16px;font-weight:800}
.xrefresh:disabled{opacity:.5}
.xhero{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:6px 0 12px}
.xst{border:1px solid var(--line);border-radius:15px;padding:14px;background:linear-gradient(180deg,var(--panel),var(--bg2));text-align:center}
.xst-v{font-size:30px;font-weight:800;line-height:1}
.xst-v.up{color:var(--green)} .xst-v.dn{color:var(--red)} .xst-v.fl{color:var(--amber)}
.xst-l{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--faint);margin-top:6px}
.xrow2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;border:1px solid var(--line);border-radius:14px;padding:4px 14px;background:var(--panel);margin-bottom:10px}
.xkv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(120,160,220,.07);font-size:13px}
.xkv span{color:var(--muted)} .xkv b{font-weight:800}
.xnote{font-size:12px;color:var(--sky);border-left:2px solid var(--sky);padding:2px 0 2px 10px;margin:2px 2px 12px}
.xbt{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:6px}
.xbt-h,.xbt-r{display:grid;grid-template-columns:1.4fr .5fr .8fr .7fr .8fr;gap:6px;align-items:center;padding:9px 12px;font-size:12.5px}
.xbt-h{background:rgba(8,16,32,.6);font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.xbt-r{border-top:1px solid rgba(120,160,220,.07)}
.xbt-h span:not(:first-child),.xbt-r span:not(:first-child){text-align:right}
.xbt-k{font-weight:700}
.xbt-wr.up,.xbt-e.up{color:var(--green)} .xbt-wr.dn,.xbt-e.dn{color:var(--red)} .xbt-wr.fl{color:var(--amber)}
.xbt-e{font-weight:800}
.xres{display:grid;grid-template-columns:16px 1fr 1.3fr auto auto;gap:9px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13px;background:rgba(8,16,32,.5)}
.xres-d{font-size:11px;font-weight:800} .xres-d.long{color:var(--green)} .xres-d.short{color:var(--red)}
.xres-s{font-weight:800}
.xres-f{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xres-st{font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.xres-st.up{color:var(--green);background:rgba(46,232,143,.12)} .xres-st.dn{color:var(--red);background:rgba(255,93,108,.12)} .xres-st.fl{color:var(--slate);background:rgba(127,141,176,.12)}
.xres-rr{font-weight:800;font-size:14px;min-width:44px;text-align:right}
.xres-rr.up{color:var(--green)} .xres-rr.dn{color:var(--red)}
.xperf-foot{text-align:center;font-size:11px;color:var(--faint);margin:16px 0 4px;letter-spacing:.02em}
</style>

      </div>` : null}

      <div>
        <div class="dsec-k">Next plug in</div>
        <div class="dprev">
          <div class="dprev-k">${nextCall[0] ? "Next community call" : "Live daily"}</div>
          <div class="dprev-t">${nextCall[0] ? nextCall[0].title : "Trading calls · 3 · 6 · 9 PM CST"}</div>
          <div class="dprev-s">${nextCall[0] ? fmtWhen(nextCall[0].starts_at).date + " · " + fmtWhen(nextCall[0].starts_at).time : "Join the community live on Zoom, every day."}</div>
          <button class="dprev-cta" onClick=${function () { props.go("plugin"); }} style="background:none;padding:0">Open Plug In ›</button>
        </div>
      </div>

      <div>
        <div class="dsec-k">Ready to trade?</div>
        <div class="dprev">
          <div class="dprev-t">Enter The Floor</div>
          <div class="dprev-s">OM AI, Market Pulse, live plays and more — your trading command center.</div>
          <button class="dprev-cta" onClick=${function () { props.goFloor(""); }} style="background:none;padding:0">Open The Floor ›</button>
        </div>
      </div>
    </div>`;
  }

  // ── Plug In — community calls + replays ─────────────────────────────────────
  function PlugInScreen(props) {
    var tick = useState(Date.now());
    var sessions = useState(null), events = useState(null), replays = useState(null), cat = useState("All");
    useEffect(function () { var iv = setInterval(function () { tick[1](Date.now()); }, 1000); return function () { clearInterval(iv); }; }, []);
    useEffect(function () {
      sbSelect("live_sessions?select=title,description,host,starts_at,join_url,category&published=eq.true&order=starts_at.asc").then(function (r) { sessions[1](r || []); });
      sbSelect("schedule_events?select=title,day,time,category,speaker,zoom_link&order=created_at.asc").then(function (r) { events[1](r || []); });
      sbSelect("trading_content?select=title,description,video_url,category,created_at&published=eq.true&order=created_at.desc").then(function (r) { replays[1]((r || []).filter(function (x) { return x.video_url; })); });
    }, []);
    var now = tick[0], LIVE_MS = 90 * 60000;
    var up = (sessions[0] || []).map(function (x) { return { title: x.title, host: x.host, cat: x.category, when: new Date(x.starts_at).getTime(), join: x.join_url, iso: x.starts_at }; }).filter(function (x) { return isFinite(x.when); });
    var featured = null; for (var i = 0; i < up.length; i++) { if (up[i].when + LIVE_MS > now) { featured = up[i]; break; } }
    var upcoming = up.filter(function (x) { return x !== featured && x.when > now; }).slice(0, 5);
    var reps = replays[0] || [];
    var cats = []; reps.forEach(function (r) { var c = r.category || "Community"; if (cats.indexOf(c) < 0) cats.push(c); });
    var shownReps = cat[0] === "All" ? reps : reps.filter(function (r) { return (r.category || "Community") === cat[0]; });

    var hero;
    if (featured) {
      var diff = featured.when - now, isLive = diff <= 0 && now < featured.when + LIVE_MS, soon = diff > 0 && diff < 15 * 60000;
      var rem = Math.max(0, diff), dd = Math.floor(rem / 86400000), hh = Math.floor(rem % 86400000 / 3600000), mm = Math.floor(rem % 3600000 / 60000), ssx = Math.floor(rem % 60000 / 1000);
      hero = html`<div class=${"pin-next" + (isLive ? " live" : "")}>
        <div class="pin-badge">${isLive ? html`<span class="dot-live"></span> Live now` : (soon ? "Starting soon" : "Next call")}</div>
        <div class="pin-when">${fmtWhen(featured.iso).date} · ${fmtWhen(featured.iso).time}${featured.host ? " · " + featured.host : ""}</div>
        <div class="pin-title">${featured.title}</div>
        ${!isLive ? html`<div class="pin-cd">
          <div class="u"><b>${pad(dd)}</b><span>days</span></div>
          <div class="u"><b>${pad(hh)}</b><span>hrs</span></div>
          <div class="u"><b>${pad(mm)}</b><span>min</span></div>
          <div class="u"><b>${pad(ssx)}</b><span>sec</span></div>
        </div>` : null}
        <a class="pin-join" href=${featured.join || LIVE_URL} target="_blank" rel="noreferrer">${isLive ? "Join live ›" : "Call details ›"}</a>
      </div>`;
    } else {
      hero = html`<div class="pin-next">
        <div class="pin-badge">Live daily</div>
        <div class="pin-when">Every day on Zoom</div>
        <div class="pin-title">Community trading calls</div>
        <div class="pin-cd">${DAILY_CALLS.map(function (c) { return html`<div class="u"><b style="font-size:14px">${c.t}</b><span>${c.label}</span></div>`; })}</div>
        <a class="pin-join" href=${LIVE_URL} target="_blank" rel="noreferrer">Join the live call ›</a>
      </div>`;
    }

    return html`<div class="scr pin">
      <div class="scr-h">Plug In</div>
      ${hero}

      ${(upcoming.length || (events[0] && events[0].length)) ? html`<div>
        <div class="dsec-k">Upcoming</div>
        ${upcoming.map(function (x) { var w = fmtWhen(x.iso); return html`<div class="pin-row">
          <div class="pin-row-d"><b>${w.date.split(" ")[1]}</b><span>${w.date.split(" ")[0]}</span></div>
          <div class="pin-row-b"><div class="pin-row-t">${x.title}</div><div class="pin-row-m">${w.time}${x.host ? " · " + x.host : ""}</div></div>
        </div>`; })}
        ${(events[0] || []).slice(0, 6).map(function (e) { return html`<div class="pin-row">
          <div class="pin-row-d"><b>${String(e.day || "").slice(0, 3)}</b><span>wkly</span></div>
          <div class="pin-row-b"><div class="pin-row-t">${e.title}</div><div class="pin-row-m">${e.time || ""}${e.speaker ? " · " + e.speaker : ""}</div></div>
        </div>`; })}
      </div>` : null}

      <div class="dsec-k">Replays</div>
      ${cats.length >= 2 ? html`<div class="pin-cats">${["All"].concat(cats).map(function (c) { return html`<button class=${"pin-cat" + (cat[0] === c ? " on" : "")} onClick=${function () { cat[1](c); }}>${c}</button>`; })}</div>` : null}
      ${reps.length ? html`<div class="replays">${shownReps.map(function (r) { return html`<a class="rep" href=${r.video_url} target="_blank" rel="noreferrer">
        <div class="rep-th">▶</div>
        <div class="rep-b"><div class="rep-t">${r.title}</div><div class="rep-m">${(r.category || "Community")}${r.created_at ? " · " + fmtWhen(r.created_at).date : ""}</div></div>
      </a>`; })}</div>` : html`<div class="emptybox">Replays from past community calls will appear here.</div>`}
    </div>`;
  }

  var NAV = [
    { id: "floor", label: "The Floor", icon: "▦" }, { id: "dashboard", label: "Dashboard", icon: "⌂" },
    { id: "account", label: "Account", icon: "◉" }, { id: "plugin", label: "Plug In", icon: "⌁" }
  ];
  function SignalsSection(props) {
    var active = useState(TOOLS[0].id), tool = TOOLS.filter(function (t) { return t.id === active[0]; })[0];
    return html`<div>
      <nav class="tabs">${TOOLS.map(function (t) { return html`<button class=${"tab " + (active[0] === t.id ? "on" : "") + (t.custom ? " tab-x" : "")} onClick=${function () { active[1](t.id); }}><span class="tab-l">${t.label}</span><span class="tab-t">${t.tag}</span></button>`; })}</nav>
      ${tool.custom ? html`<${XGhostSection} key="xghost" onLogout=${props.onLogout} />` : html`<${ToolRunner} key=${active[0]} tool=${tool} onLogout=${props.onLogout} />`}
    </div>`;
  }
  function Shell(props) {
    var sec = useState("dashboard");
    var floorInit = useState("");
    function go(id) { sec[1](id); }
    function goFloor(v) { floorInit[1](v || ""); sec[1]("floor"); }
    return html`<div class="shell">
      <main class="main">
        ${sec[0] === "dashboard" ? html`<${DashboardScreen} go=${go} goFloor=${goFloor} onLogout=${props.onLogout} />` : null}
        ${sec[0] === "floor" ? html`<${FloorSection} key=${"fl" + floorInit[0]} init=${floorInit[0]} onLogout=${props.onLogout} />` : null}
        ${sec[0] === "account" ? html`<${AccountScreen} onLogout=${props.onLogout} onOpenXperf=${function () { sec[1]("xperf"); }} />` : null}
        ${sec[0] === "plugin" ? html`<${PlugInScreen} onLogout=${props.onLogout} />` : null}
        ${sec[0] === "xperf" ? html`<${XGhostStatsScreen} onBack=${function () { sec[1]("account"); }} onLogout=${props.onLogout} />` : null}
      </main>
      <nav class="bnav">${NAV.map(function (n) { var on = sec[0] === n.id || (sec[0] === "xperf" && n.id === "account"); return html`<button class=${"bn " + (on ? "on" : "")} onClick=${function () { if (n.id === "floor") goFloor(""); else go(n.id); }}><span class="bn-i">${n.icon}</span><span class="bn-l">${n.label}</span></button>`; })}</nav>
    </div>`;
  }
  function Login(props) {
    var email = useState(""), pw = useState(""), busy = useState(false), err = useState("");
    function submit(e) { e.preventDefault(); if (busy[0]) return; busy[1](true); err[1](""); signIn(email[0], pw[0]).then(function (r) { busy[1](false); if (r.error) return err[1](r.error); props.onIn(); }); }
    return html`<div class="login"><div class="login-box">
      <div class="brand big">OM<span>AI</span></div><p class="tag">The Floor — trade desk</p>
      <form onSubmit=${submit}>
        <input class="inp" type="email" placeholder="Email" value=${email[0]} onInput=${function (e) { email[1](e.target.value); }} autocomplete="email" />
        <input class="inp" type="password" placeholder="Password" value=${pw[0]} onInput=${function (e) { pw[1](e.target.value); }} autocomplete="current-password" />
        <button class="run" disabled=${busy[0]}>${busy[0] ? "Signing in…" : "Sign in"}</button>
        ${err[0] ? html`<div class="err">${err[0]}</div>` : null}
      </form>
      <p class="hint">Use your One Mission member login to enter the trade desk.</p>
    </div></div>`;
  }
  function App() {
    var authed = useState(!!(getSession() && getSession().access_token));
    return authed[0] ? html`<${Shell} onLogout=${function () { setSession(null); authed[1](false); }} />` : html`<${Login} onIn=${function () { authed[1](true); }} />`;
  }
  adoptLegacySession();
  render(html`<${App} />`, document.getElementById("app"));
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/app/sw.js").catch(function(){});}</script>
</body>
</html>
