<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#08090e"/>
<link rel="manifest" href="/app/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/app/icon-180.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>One Mission</title>
<!--
  THE MEMBERS' INSTALLED APP, ON THE NEW DESIGN (owner 11-21: "push live to everyone", then "App looks the same").

  Phones keep a Home Screen app to the address it was installed from (/app/), so this page cannot become the new
  app's own pages; it frames them instead. Everything inside is the live site: The Floor, OM AI Plays, GENX, Market
  Pulse, FLOW and Atlas, in the member's own look (Stone or Graphite). The installed app was set up with a dark,
  see-through status bar (white clock), so the strip behind it stays dark; the strip under the home indicator takes
  the look's tab-bar colour. A payment page will not open inside a frame, so checkout and billing leave the frame
  (src/lib/leave.ts). `?to=` opens a page of this site instead of The Floor.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08090e; }
  .om-top { position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: #08090e; }
  .om-bottom { position: fixed; left: 0; right: 0; bottom: 0; height: env(safe-area-inset-bottom, 0px); background: var(--om-bar, #ffffff); }
  iframe {
    position: fixed; border: 0; display: block; background: var(--om-page, #f5f4f1);
    top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  }
</style>
</head>
<body>
<div class="om-top"></div>
<iframe id="om-app" title="One Mission" allow="microphone; autoplay; clipboard-write; fullscreen"></iframe>
<div class="om-bottom"></div>
<script>
(function () {
  // Which page: The Floor, or a page of this site named by ?to= (never another site).
  var to = "/portal/trading";
  try {
    var q = new URLSearchParams(location.search).get("to") || "";
    if (q.charAt(0) === "/" && q.charAt(1) !== "/" && q.charAt(1) !== "\\" && !/[\r\n]/.test(q) && q.length < 512) to = q;
  } catch (e) {}
  document.getElementById("om-app").src = to;

  // The strips around the frame follow the member's look (Stone by default; Graphite if chosen).
  function paint() {
    var g = false;
    try { g = localStorage.getItem("om-look") === "graphite"; } catch (e) {}
    var r = document.documentElement.style;
    r.setProperty("--om-bar", g ? "#1f1f22" : "#ffffff");
    r.setProperty("--om-page", g ? "#1a1a1d" : "#f5f4f1");
  }
  paint();
  window.addEventListener("storage", paint);

  // The app's service worker, as before: a new version of this page shows on the next launch.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/app/sw.js").catch(function () {});
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () { if (reloaded) return; reloaded = true; location.reload(); });
  }
})();
</script>
</body>
</html>
