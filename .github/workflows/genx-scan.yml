name: GENX auto-scan + alerts

# CONTINUOUS coverage that does NOT depend on GitHub's (unreliable) scheduler.
# Each run self-loops for hours: a FULL scan every ~5 min (finds setups, sends
# heads-ups, grades wins, fires ENTER on the 5-min close) and a FAST-WATCH every
# 30s (re-confirms 'forming' setups on 1-minute closes so an ENTER NOW alert
# reaches Telegram the moment price activates at the zone). cancel-in-progress
# means a newer trigger just restarts a fresh loop, so there's always one running.
# All work (engine, confirmation, Telegram send) happens server-side.

on:
  schedule:
    - cron: "*/5 * * * 1-5"   # a heartbeat to (re)start the loop if it ever ends
  workflow_dispatch: {}         # start it on demand from the Actions tab

concurrency:
  group: genx-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: GENX continuous full-scan + 30s fast-watch
        env:
          KEY: ${{ secrets.GENX_CRON_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "GENX_CRON_KEY secret not set — skipping until configured"; exit 0; fi
          BASE="https://weare1mission.com/api/cron/genx-scan?key=$KEY"
          # ~5.75h of continuous coverage: full scan every 10th tick (~5 min),
          # fast-watch (1-min confirm on 'forming' setups) every 30s in between.
          for i in $(seq 0 690); do
            if [ $((i % 10)) -eq 0 ]; then
              curl -sS -m 60 -X POST "$BASE" -o /tmp/o.json -w "t$i full HTTP %{http_code}\n" || true
            else
              curl -sS -m 30 -X POST "$BASE&watch=1" -o /tmp/o.json -w "t$i watch HTTP %{http_code}\n" || true
            fi
            head -c 220 /tmp/o.json; echo
            sleep 30
          done
