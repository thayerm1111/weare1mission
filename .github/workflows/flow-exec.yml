name: FLOW auto-executor

# CONTINUOUS coverage that does NOT depend on GitHub's (unreliable) 5-min
# scheduler. Each run self-loops for hours: a FULL scan every ~5 min (finds
# setups, places on ENTER_NOW, refreshes the at-zone list) and a FAST-WATCH
# every 30s (re-confirms at-zone setups on 1-minute closes and fires the moment
# buyers/sellers activate). cancel-in-progress means a newer trigger simply
# restarts a fresh loop, so there's always exactly one running.
#
# Reuses the existing GENX_CRON_KEY secret (endpoint accepts FLOW_CRON_KEY,
# GENX_CRON_KEY, or CRON_SECRET) so it needs no new configuration.

on:
  # Native Vercel Cron (see vercel.json) now drives the executor every minute on
  # Vercel's own scheduler (Pro plan). The GitHub schedule is removed so the two
  # don't double-run; kept as a manual-dispatch backup you can start any time.
  workflow_dispatch: {}         # start it on demand from the Actions tab

concurrency:
  group: flow-exec
  cancel-in-progress: true

jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: FLOW continuous full-scan + 30s fast-watch
        env:
          KEY: ${{ secrets.FLOW_CRON_KEY || secrets.GENX_CRON_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "No FLOW_CRON_KEY/GENX_CRON_KEY secret set — skipping"; exit 0; fi
          BASE="https://weare1mission.com/api/cron/flow-exec?key=$KEY"
          # ~5.75h of continuous coverage: full scan every 10th tick (~5 min),
          # fast-watch (1-min confirm) every 30s in between.
          for i in $(seq 0 690); do
            if [ $((i % 10)) -eq 0 ]; then
              curl -sS -m 60 -X POST "$BASE" -o /tmp/o.json -w "t$i full HTTP %{http_code}\n" || true
            else
              curl -sS -m 30 -X POST "$BASE&watch=1" -o /tmp/o.json -w "t$i watch HTTP %{http_code}\n" || true
            fi
            head -c 220 /tmp/o.json; echo
            sleep 30
          done
